[server]
# 可通过 CONFIG_PATH 环境变量指定配置文件路径，默认读取当前工作目录下的 config.toml
host = "0.0.0.0"
# 监听端口
port = 5000
# Github文件大小限制（字节），默认2GB
fileSize = 2147483648
# HTTP/2 多路复用
enableH2C = false
enableFrontend = true

[rateLimit]
# 每个IP每周期允许的请求数
requestLimit = 500
# 限流周期（小时）
periodHours = 3.0

[security]
# IP白名单，支持单个IP或IP段
# 白名单中的IP不受限流限制
whiteList = [
    "127.0.0.1",
    "127.0.0.2"
]

# IP黑名单，支持单个IP或IP段
# 黑名单中的IP将被直接拒绝访问
blackList = [
    "192.168.100.1",
    "192.168.100.0/24"
]

[access]
# 代理服务白名单（支持GitHub仓库和Docker镜像，支持通配符）
# 只允许访问白名单中的仓库/镜像，为空时不限制
whiteList = []

# 代理服务黑名单（支持GitHub仓库和Docker镜像，支持通配符）
# 禁止访问黑名单中的仓库/镜像
blackList = [
    "baduser/malicious-repo",
    "*/malicious-repo",
    "baduser/*"
]

# 代理配置，支持有用户名/密码认证和无认证模式
# 无认证: socks5://127.0.0.1:1080
# 有认证: socks5://username:password@127.0.0.1:1080
# 留空不使用代理
proxy = "" 

[download]
# 批量下载离线镜像数量限制
maxImages = 10

# Registry映射配置，支持多种镜像仓库上游
[registries]

# GitHub Container Registry
[registries."ghcr.io"]
upstream = "ghcr.io"
authHost = "ghcr.io/token" 
authType = "github"
enabled = true

# Google Container Registry
[registries."gcr.io"]
upstream = "gcr.io"
authHost = "gcr.io/v2/token"
authType = "google"
enabled = true

# Quay.io Container Registry
[registries."quay.io"]
upstream = "quay.io"
authHost = "quay.io/v2/auth"
authType = "quay"
enabled = true

# Kubernetes Container Registry
[registries."registry.k8s.io"]
upstream = "registry.k8s.io"
authHost = "registry.k8s.io"
authType = "anonymous"
enabled = true

[tokenCache]
# 是否启用缓存(同时控制Token和Manifest缓存)显著提升性能
enabled = true
# 默认缓存时间(分钟)
defaultTTL = "20m"

# ── 国内访问优化（可选）──────────────────────────────
# 针对国内网络环境，复用 gh-proxy 这类"国内可达"的第三方反代作为回源通道，
# 避免直连被墙的 Docker Hub / GitHub，最大化利用国内机子的带宽。
[chinaOptimize]
# 国内访问优化模式：
#   ""       关闭（默认，保持原生直连上游）
#   "backend" 后端回源改写：对外仍用本地原生 Registry API v2 / GitHub 代理，
#            但回源拉取这一跳改写为下方回源地址，客户端 docker pull / wget 命令零改动。
#   "302"    重定向模式：GitHub 加速直接 302 跳转到回源地址，由客户端直连。
#            （Docker 因 Registry v2 协议无法用 302，仍走后端回源改写）
# 两种模式都会把"回源地址自身返回的 302"提前扁平化，避免多次 302：
#   - backend：在服务端逐跳跟随；若跳转回 GitHub 家族地址，会重新按回源地址改写，
#             保证每一跳都走国内反代，客户端全程看不到 302。
#   - 302：先在后端解析出最终地址，客户端只经历一次跳转、直接命中最终地址。
mode = ""

# ── Docker/Registry 回源目标（仅 backend 模式下、"无鉴权"请求生效）──
# gh-proxy 类加速源可作为 docker pull 目标（docker pull {dockerBase}/nginx 能拉下镜像），
#   但不能写进 daemon.json 的 registry-mirrors（它不是透明 Docker Hub 镜像，路径带 /docker 前缀）。
# 支持两种写法（按 registry 主机划分作用域，可覆盖 Docker Hub / gcr / ghcr / registry.k8s.io 等）：
#   1) 单个字符串：dockerBase = "https://gh-proxy.org/docker"（仅作用于 Docker Hub）
#   2) 数组：dockerBase = [{ host = "gcr.io", base = "https://gcr.example.com" }, ...]（每项一个 registry）
# 只改写：配置中对应主机的无鉴权(Authorization)请求 → {base}/v2/...
# 未配置的 registry、有鉴权/私有镜像：直接走原路由直连上游。
dockerBase = "https://gh-proxy.org/docker"

# ── 数组写法示例（按 registry 划分作用域，取消注释并删除上面的单字符串即可）──
# 同一个 gh-proxy 类加速源常同时支持 GCR / GHCR / Kubernetes / Docker Hub：
# dockerBase = [
#   { host = "registry-1.docker.io", base = "https://gh-proxy.org/docker" },
#   { host = "gcr.io",               base = "https://gcr.example.com" },
#   { host = "ghcr.io",              base = "https://ghcr.example.com" },
#   { host = "registry.k8s.io",      base = "https://k8s.example.com" },
# ]

# GitHub 回源基础地址（backend / 302 模式生效）
#   gh-proxy 实测可加速 GitHub（返回真实文件）
#   实际请求/跳转 = {githubBase}/https://github.com/...
githubBase = "https://gh-proxy.com"
